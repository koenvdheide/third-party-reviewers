name: Mod tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The existing fixtures use Windows paths; the engine resolves paths for its host OS.
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.301
      - name: Run all mod test suites
        run: |
          claude --version
          claude plugin test .
